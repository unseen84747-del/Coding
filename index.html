<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">MV</div>
          <div>
            <p class="eyebrow">Trending now</p>
            <h1>MovieVerse</h1>
          </div>
        </div>

        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="search" placeholder="Search movies..." aria-label="Search movies" />
        </div>
      </header>

      <main>
        <section class="hero" id="heroSection">
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <p class="hero-tag">Featured pick</p>
            <h2 id="featuredTitle">Dune: Part Two</h2>
            <div class="meta-row">
              <span id="featuredYear">2024</span>
              <span id="featuredGenre">Sci-Fi</span>
              <span id="featuredRating">★ 9.0</span>
            </div>
            <p id="featuredDescription">
              Paul Atreides seeks vengeance while navigating a desert war that will reshape the galaxy.
            </p>
            <div class="hero-actions">
              <button class="primary-btn" id="featuredActionBtn">Watch trailer</button>
              <button class="ghost-btn" id="featuredFavoriteBtn">Add to watchlist</button>
            </div>
          </div>
        </section>

        <section class="controls">
          <div class="filter-group" id="genreFilters" aria-label="Filter by genre">
            <button class="filter-btn active" data-genre="All">All</button>
            <button class="filter-btn" data-genre="Action">Action</button>
            <button class="filter-btn" data-genre="Drama">Drama</button>
            <button class="filter-btn" data-genre="Comedy">Comedy</button>
            <button class="filter-btn" data-genre="Animation">Animation</button>
            <button class="filter-btn" data-genre="Sci-Fi">Sci-Fi</button>
          </div>

          <div class="stats">
            <div class="stat-box">
              <span class="stat-label">Total movies</span>
              <strong id="totalMovies">0</strong>
            </div>
            <div class="stat-box">
              <span class="stat-label">Watchlist</span>
              <strong id="watchlistCount">0</strong>
            </div>
          </div>
        </section>

        <section class="catalog">
          <div class="section-title-row">
            <h3>Browse collection</h3>
            <button class="text-btn" id="clearFiltersBtn">Clear filters</button>
          </div>
          <div id="movieGrid" class="movie-grid" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div class="modal hidden" id="movieModal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="closeModalBtn" aria-label="Close movie details">×</button>
        <div class="modal-poster-wrap">
          <img id="modalPoster" src="" alt="Movie poster" />
        </div>
        <div class="modal-content">
          <p class="eyebrow">Now showing</p>
          <h3 id="modalTitle">Movie title</h3>
          <div class="meta-row compact">
            <span id="modalYear">2024</span>
            <span id="modalGenre">Drama</span>
            <span id="modalRuntime">2h 15m</span>
            <span id="modalRating">★ 8.9</span>
          </div>
          <p id="modalDescription"></p>
          <div class="modal-tags" id="modalTags"></div>
          <button class="primary-btn modal-btn" id="modalFavoriteBtn">Add to watchlist</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
